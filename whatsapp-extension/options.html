<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>הגדרות סנכרון וואטסאפ</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 18px; }
    label { display: block; font-size: 13px; color: #444; margin: 16px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; direction: ltr; text-align: left; }
    button { margin-top: 16px; padding: 8px 20px; border: none; border-radius: 6px; background: #2563eb; color: white; font-size: 14px; cursor: pointer; }
    p.hint { font-size: 12px; color: #777; }
    #saved { color: #15803d; font-size: 13px; margin-right: 10px; }
  </style>
</head>
<body>
  <h1>⚙️ הגדרות סנכרון וואטסאפ</h1>
  <p class="hint">
    הטוקן נמצא ב-<code dir="ltr">backend/.env</code> של השרת (<code dir="ltr">WHATSAPP_EXTENSION_TOKEN</code>) —
    את הערך מקבלים מאבנר, לא ממציאים כאן.
  </p>

  <label for="backendUrl">כתובת שרת ה-CRM (backend)</label>
  <input id="backendUrl" placeholder="https://teacher-crm-backend.onrender.com" />

  <label for="token">טוקן חיבור</label>
  <input id="token" placeholder="הדביקו כאן את הטוקן" />

  <div>
    <button id="saveBtn">שמור</button>
    <span id="saved"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
